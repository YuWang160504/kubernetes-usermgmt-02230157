
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usermgmt-frontend
  namespace: usermgmt-02230157

spec:
  replicas: 1

  selector:
    matchLabels:
      app: usermgmt-frontend

  template:
    metadata:
      labels:
        app: usermgmt-frontend

    spec:
      containers:
        - name: frontend
          image: usermgmt-frontend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
